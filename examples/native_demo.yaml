  label_T: mpg_central
  label_kF: mpg_central
  n_tau_eff: 1
  n_sigT_kms: 1
  n_gamma: 1
  n_kF_kms: 1
  tau_eff_ztype: pivot
  sigT_kms_ztype: pivot
  gamma_ztype: pivot
  kF_kms_ztype: pivot
  tau_eff_otype: exp
  sigT_kms_otype: const
  gamma_otype: const
  kF_kms_otype: const
