theory:
  camb:
    extra_args:
      WantCls: false
      Want_CMB: false
      nonlinear: false
      neutrino_hierarchy: degenerate
      num_massive_neutrinos: 1
      pivot_scalar: 0.05
      pivot_tensor: 0.05
  lya_interface.theory.lya_cosmology.LyaCosmology:
    stop_at_error: true
    kmax_iMpc: 200.0
    snapshot_nodes: 4096
    z_star: 3.0
    k_star_ikms: 0.009
  lya_interface.theory.forestflow.ForestFlowTheory:
    stop_at_error: true
    native_config: examples/native_cm2026_forestmpggp.yaml
    parameter_definitions: *definitions
    emulator_label: forest_mpg_gp
    realizations: 1000
    seed: 0
    hull_factor: 1.15
    enforce_training_hull: false  # Temporary exploratory override: permits extrapolation.
    cosmology_domain:
      H0: [65.0, 70.0]
      ombh2: [0.02237, 0.02237]
      omch2: [0.12, 0.12]
      mnu: [0.06, 0.06]
      nnu: [3.044, 3.044]
      omk: [0.0, 0.0]
      nrun: [0.0, 0.0]
    # Split Gauss-Legendre in ln k at fixed k_par (cup1d's native rule), split at
    # k = 0.4/Mpc. On DESI DR1 (forest_mpg_gp, P1D and Kaiser-metal moments, 4
    # points) |delta chi2| <= 0.025 against a converged reference. The high-k
    # segment needs 32 nodes, and k_perp_min = 1e-3 /Mpc biases chi2 by ~0.25
    # (the strip down to 1e-4 is ~1e-4 of P1D at the lowest k).
    projection:
      rule: k_mu
      k_perp_min_iMpc: 0.0001
      k_perp_max_iMpc: 100.0
      k_split_iMpc: 0.4
      n_low: 32
      n_high: 32
likelihood:
  lya_interface.likelihoods.cup1d.Cup1DLikelihood:
    stop_at_error: true
    native_config: examples/native_cm2026_forestmpggp.yaml
    parameter_definitions: *definitions
    covariance_asset: ../ForestFlow/data/covariance/l1O_cov_forest_mpg_gp.npy
    blinding_policy: native
    include_logdet: false
    # Frozen native Planck18_noBAO M(z) = H(z)/(1+z), km/s/Mpc; used only for error covariance.
    fiducial_M:
