# DESI DR1 P1D (CM2026 baseline with forest_mpg_gp, see cup1d_forestmpggp_evaluate.yaml)
# combined with the DESI DR2 Lya BAO correlations fitted with Vega
# (data_bao/dr2, 4 correlations: lyaxlya, lyaxlyb, lyaxqso, lybxqso, with the
# smoothed global covariance). ForestFlow, at the shared cosmology and IGM,
# supplies the Lya bias, beta and the small-scale nonlinear correction to Vega;
# bias_LYA and beta_LYA are therefore not free BAO parameters. The P1D-BAO
# cross-covariance is assumed zero.
#
# The BAO nuisances are those sampled in the DR2 baseline (main.ini [sample]).
# Flat ranges come from main.ini, else from Vega's default_values.txt; the
# Gaussian priors of main.ini [priors] become truncated normals on those ranges,
# as in Vega. References are the Gaussian prior means, or the main.ini
# [parameters] values for flat priors (bias_hcd: its [sample] start value).
interface_base: cup1d_forestmpggp_evaluate.yaml

parameter_overrides:
  ap: {prior: {min: 0.5, max: 1.5}, ref: 1.0, proposal: 0.01}
  at: {prior: {min: 0.5, max: 1.5}, ref: 1.0, proposal: 0.01}
  xi3d_sigma_velo_disp_lorentz_QSO: {prior: {min: 0.0, max: 15.0}, ref: 3.8, proposal: 0.1}
  xi3d_qso_rad_strength: {prior: {min: 0.0, max: 2.0}, ref: 0.36, proposal: 0.01}
  xi3d_bias_hcd: {prior: {min: -1.0, max: 0.0}, ref: -0.05, proposal: 0.01}
  xi3d_bias_SiII_1190: {prior: {min: -0.5, max: 0.0}, ref: -0.0052, proposal: 0.001}
  xi3d_bias_SiII_1193: {prior: {min: -0.5, max: 0.0}, ref: -0.0024, proposal: 0.001}
  xi3d_bias_SiIII_1207: {prior: {min: -0.5, max: 0.0}, ref: -0.0074, proposal: 0.001}
  xi3d_bias_SiII_1260: {prior: {min: -0.5, max: 0.0}, ref: -0.0046, proposal: 0.001}
  xi3d_desi_inst_sys_amp: {prior: {min: 0.0, max: 0.01}, ref: 0.0001, proposal: 5e-05}
  xi3d_bias_QSO: {prior: {dist: truncnorm, a: -17, b: 13, loc: 3.4, scale: 0.2}, ref: 3.4, proposal: 0.05}
  xi3d_drp_QSO: {prior: {dist: truncnorm, a: -3, b: 3, loc: 0.0, scale: 1.0}, ref: 0.0, proposal: 0.1}
  xi3d_beta_hcd: {prior: {dist: truncnorm, a: -5.555555556, b: 50, loc: 0.5, scale: 0.09}, ref: 0.5, proposal: 0.02}
  xi3d_L0_hcd: {prior: {dist: truncnorm, a: -5, b: 10, loc: 5.0, scale: 1.0}, ref: 5.0, proposal: 0.1}
  xi3d_bias_CIV_eff: {prior: {dist: truncnorm, a: -96.2, b: 3.8, loc: -0.019, scale: 0.005}, ref: -0.019, proposal: 0.001}

additional_likelihoods:
  lya_interface.likelihoods.vega.VegaLikelihood:
    native_config: vega_dr2_forestflow_main.ini
    template_h: 0.6736  # H0 = 67.36 in the header of Vega's Planck18/DESI-2024_z_2.33.fits.
    use_forestflow: true
    prior_policy: external
    parameter_mapping:
      ap: ap
      at: at
      xi3d_sigma_velo_disp_lorentz_QSO: sigma_velo_disp_lorentz_QSO
      xi3d_qso_rad_strength: qso_rad_strength
      xi3d_bias_hcd: bias_hcd
      xi3d_bias_SiII_1190: 'bias_SiII(1190)'
      xi3d_bias_SiII_1193: 'bias_SiII(1193)'
      xi3d_bias_SiIII_1207: 'bias_SiIII(1207)'
      xi3d_bias_SiII_1260: 'bias_SiII(1260)'
      xi3d_desi_inst_sys_amp: desi_inst_sys_amp
      xi3d_bias_QSO: bias_QSO
      xi3d_drp_QSO: drp_QSO
      xi3d_beta_hcd: beta_hcd
      xi3d_L0_hcd: L0_hcd
      xi3d_bias_CIV_eff: 'bias_CIV(eff)'
