[data]
name = lybxqso
tracer1 = LYA
tracer2 = QSO
tracer1-type = continuous
tracer2-type = discrete
base = /home/jchaves/Proyectos/projects/lya/data/data_bao/
filename = %(base)s/dr2/correlations/cf_qso_x_lyb_exp.fits
distortion-file = %(base)s/dr2/correlations/dmat_qso_x_lyb.fits
weights-tracer1 = %(base)s/dr2/deltas_lyb/Log/delta_attributes.fits.gz
weights-tracer2 = %(base)s/dr2/catalogs/QSO_cat_loa_main_dark_healpix_v2.fits

[cuts]
rp-min = -200.
rp-max = +200.
rt-min = 0
rt-max = 200.
r-min = 30
r-max = 180
mu-min = -1.
mu-max = +1.

[model]
z evol LYA = bias_vs_z_std
z evol QSO = bias_vs_z_std
model-hcd = Rogers2018
# off: the metal decorrelation will be varied (fast metals freezes metal shapes)
fast_metals = False
new_metals = True
rp_only_metal_mats = False
velocity dispersion = lorentz
radiation effects = True

[metals]
filename = None
z evol = bias_vs_z_std
in tracer1 = SiII(1190) SiII(1193) SiIII(1207) SiII(1260) CIV(eff)
velocity dispersion = lorentz

[metal-matrix]
rebin_factor = 3
alpha_LYA = 2.9
alpha_SiII(1260) = 1.
alpha_SiIII(1207) = 1.
alpha_SiII(1193) = 1.
alpha_SiII(1190) = 1.
alpha_CIV(eff) = 0.
z_ref_objects = 2.25
z_evol_objects = 1.44
z_bins_objects = 1000

