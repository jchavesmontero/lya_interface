# Derived from data_bao/dr2/fits/lyaxlya.ini with the line-of-sight Kaiser metal model
# shared with P1D: ForestFlow nonlinear correction (sqrt of D_NL for Lya x metal),
# line-of-sight decorrelation of Lya x metal (supplied by lya_interface), fast_metals off.
# File written on 2024-12-20 15:15:36.283011 
# Vega git hash: 5e69d717f0a4351286fd9091a65915243ab4ebd1 

[data]
name = lyaxlya
tracer1 = LYA
tracer2 = LYA
tracer1-type = continuous
tracer2-type = continuous
base = /home/jchaves/Proyectos/projects/lya/data/data_bao/
filename = %(base)s/dr2/correlations/cf_lya_x_lya_exp.fits
distortion-file = %(base)s/dr2/correlations/dmat_lya_x_lya.fits
weights-tracer1 = %(base)s/dr2/deltas_lya/Log/delta_attributes.fits.gz
weights-tracer2 = %(base)s/dr2/deltas_lya/Log/delta_attributes.fits.gz

[cuts]
rp-min = -200.
rp-max = +200.
rt-min = 0
rt-max = 200.
r-min = 30
r-max = 180
mu-min = -1.
mu-max = +1.

[model]
z evol LYA = bias_vs_z_std
small scale nl = forestflow
use_metal_autos = True
desi-instrumental-systematics = True
model-hcd = Rogers2018
# off: the metal decorrelation will be varied (fast metals freezes metal shapes)
fast_metals = False
new_metals = True
rp_only_metal_mats = False

[metals]
small scale nl = forestflow
filename = None
z evol = bias_vs_z_std
in tracer1 = SiII(1190) SiII(1193) SiIII(1207) SiII(1260) CIV(eff)
in tracer2 = SiII(1190) SiII(1193) SiIII(1207) SiII(1260) CIV(eff)

[metal-matrix]
rebin_factor = 3
alpha_LYA = 2.9
alpha_SiII(1260) = 1.
alpha_SiIII(1207) = 1.
alpha_SiII(1193) = 1.
alpha_SiII(1190) = 1.
alpha_CIV(eff) = 0.
z_ref_objects = 2.25
z_evol_objects = 1.44
z_bins_objects = 1000

