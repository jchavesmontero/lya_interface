# Native Vega reference through the lya_interface data-only adapter.
# This preserves Vega's fixed template and migrates its three Gaussian priors
# to Cobaya exactly once. It is intentionally not a ForestFlow-coupled fit.
params:
  ap: {prior: {min: 0.8, max: 1.2}, ref: 1.0, proposal: 0.02}
  at: {prior: {min: 0.8, max: 1.2}, ref: 1.0, proposal: 0.02}
  xi3d_beta_hcd: {prior: {dist: norm, loc: 0.5, scale: 0.09}, ref: 0.5, proposal: 0.02}
  xi3d_L0_hcd: {prior: {dist: norm, loc: 5.0, scale: 2.0}, ref: 5.3, proposal: 0.1}
  xi3d_drp_QSO: {prior: {dist: norm, loc: 0.0, scale: 1.0}, ref: 0.0, proposal: 0.1}
likelihood:
  lya_interface.likelihoods.vega.VegaLikelihood:
    native_config: /home/jchaves/Proyectos/projects/lya/data/mocks_bao/baseline/fits/main_lya.ini
    use_forestflow: false
    prior_policy: external
    parameter_mapping:
      ap: ap
      at: at
      xi3d_beta_hcd: beta_hcd
      xi3d_L0_hcd: L0_hcd
      xi3d_drp_QSO: drp_QSO
    parameter_definitions:
      ap: {prior: {min: 0.8, max: 1.2}, ref: 1.0, proposal: 0.02}
      at: {prior: {min: 0.8, max: 1.2}, ref: 1.0, proposal: 0.02}
      xi3d_beta_hcd: {prior: {dist: norm, loc: 0.5, scale: 0.09}, ref: 0.5, proposal: 0.02}
      xi3d_L0_hcd: {prior: {dist: norm, loc: 5.0, scale: 2.0}, ref: 5.3, proposal: 0.1}
      xi3d_drp_QSO: {prior: {dist: norm, loc: 0.0, scale: 1.0}, ref: 0.0, proposal: 0.1}
